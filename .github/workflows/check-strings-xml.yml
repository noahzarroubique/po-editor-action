name: Check strings.xml on PR

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  check-strings-xml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for accurate diff

      - name: Find changed strings.xml files
        id: find_strings
        run: |
          git fetch origin ${{ github.base_ref }}
          git status
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep 'strings.xml' || true
        shell: bash

      - name: Get list of changed strings.xml files
        id: changed_strings
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep 'strings.xml' || true > changed_strings.txt
          echo "files=$(cat changed_strings.txt | xargs)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Run logical checks on changed strings.xml files
        if: steps.changed_strings.outputs.files != ''
        env:
          FILES: ${{ steps.changed_strings.outputs.files }}
        run: |
          pip install lxml
          python3 .github/scripts/check_strings.py

      - name: Comment on PR with results
        if: steps.changed_strings.outputs.files != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(cat .github/scripts/strings_issues.txt)
          gh pr comment ${{ github.event.pull_request.number }} --body "$body" || \
          gh issue comment ${{ github.event.pull_request.number }} --body "$body"
