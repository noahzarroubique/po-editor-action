name: Check strings.xml on PR

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  check-strings-xml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect base branch (main or master)
        id: detect_base
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "BASE_BRANCH=main" >> $GITHUB_ENV
          elif git show-ref --verify --quiet refs/remotes/origin/master; then
            echo "BASE_BRANCH=master" >> $GITHUB_ENV
          else
            echo "No main or master branch found!" >&2
            exit 1
          fi

      - name: Fetch all history
        run: git fetch --unshallow || true

      - name: Fetch base branch
        run: git fetch origin ${{ env.BASE_BRANCH }}:${{ env.BASE_BRANCH }}

      - name: Get changed strings.xml files
        id: changed_files
        run: |
          FILES="$(git diff --name-only ${{ env.BASE_BRANCH }}...HEAD | grep 'strings.xml')" 
          echo "FILES=$FILES" >> $GITHUB_ENV

      - name: Run logical checks on changed strings.xml files
        if: env.FILES != ''
        run: |
          pip install lxml
          python3 .github/scripts/check_strings.py

      - name: Comment on PR with results
        if: env.FILES != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(cat .github/scripts/strings_issues.txt)
          gh pr comment ${{ github.event.pull_request.number }} --body "$body" || \
          gh issue comment ${{ github.event.pull_request.number }} --body "$body"
